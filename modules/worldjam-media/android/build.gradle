apply plugin: 'com.android.library'

group = 'com.worldjam.media'
version = '0.1.0'

// Same wiring as the other local modules: Kotlin plugin, expo-modules-core and
// shared SDK versions come from ExpoModulesCorePlugin.
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace 'com.worldjam.media'

  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.1.0'
    ndk {
      abiFilters 'arm64-v8a'
    }
  }

  testOptions {
    unitTests.returnDefaultValues = true
  }
}

dependencies {
  testImplementation 'junit:junit:4.13.2'
  // Android's org.json is a stub under JVM unit tests; use the real one there.
  testImplementation 'org.json:json:20240303'
}
