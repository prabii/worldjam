apply plugin: 'com.android.library'

group = 'com.worldjam.audio'
version = '0.1.0'

// Matches how the first-party Expo modules wire themselves up; this brings in
// the Kotlin plugin, the expo-modules-core dependency and the shared SDK
// versions.
def expoModulesCorePlugin = new File(
  project(":expo-modules-core").projectDir.absolutePath,
  "ExpoModulesCorePlugin.gradle"
)
apply from: expoModulesCorePlugin
applyKotlinExpoModulesCorePlugin()
useCoreDependencies()
useDefaultAndroidSdkVersions()

android {
  namespace 'com.worldjam.audio'

  defaultConfig {
    minSdkVersion 26
    versionCode 1
    versionName '0.1.0'

    externalNativeBuild {
      cmake {
        // Oboe needs C++17; the shared STL keeps the .so small.
        arguments '-DANDROID_STL=c++_shared', '-DCMAKE_BUILD_TYPE=Release'
        cppFlags '-std=c++17 -O3'
      }
    }

    ndk {
      // 64-bit only: the loaner is arm64, and dropping the other ABIs roughly
      // halves both build time and peak memory.
      abiFilters 'arm64-v8a'
    }
  }

  externalNativeBuild {
    cmake {
      path 'src/main/cpp/CMakeLists.txt'
      version '3.22.1'
    }
  }

  // Oboe ships as a prefab AAR; without this the CMake find_package fails.
  buildFeatures {
    prefab true
  }

  packagingOptions {
    // expo-modules-core also ships libc++_shared; keep one copy.
    pickFirst '**/libc++_shared.so'
  }
}

dependencies {
  implementation 'com.google.oboe:oboe:1.9.0'
  // ARCore for world-anchored sound objects. Optional at runtime: the manifest
  // marks AR as "optional" and ArSessionManager degrades to the 2D placement
  // path on devices without it (HLD v2 SS2 - AR is a removable layer).
  implementation 'com.google.ar:core:1.45.0'
}
